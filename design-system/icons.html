h1 .en{font-family:var(--f-type);font-size:14px;font-weight:400;color:var(--cobalt);display:block;letter-spacing:.2em;margin-bottom:6px}
.sub{font-size:14px;color:rgba(58,70,86,.7);max-width:640px;margin-top:8px}
.sheet{max-width:1060px;margin:0 auto 46px;background:var(--white);box-shadow:0 3px 18px rgba(58,70,86,.10);padding:26px 28px 30px;position:relative}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:20px}
.sheet-head b{font-size:19px;font-weight:800}
.sheet-head .meta{font-family:var(--f-type);font-size:11px;color:var(--gray);letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
/* 邮票齿孔 chip */
.stamp{padding:9px;position:relative;background-position:-9px -9px;background-size:18px 18px}
.stamp-inner{background:var(--white);border:1px solid rgba(58,70,86,.18);padding:14px 10px 10px;text-align:center;position:relative;
  transition:transform .18s ease, box-shadow .18s ease}
.stamp:hover .stamp-inner{transform:rotate(-1.6deg) translateY(-3px);box-shadow:0 6px 14px rgba(58,70,86,.14)}
.stamp svg{width:78px;height:78px;display:block;margin:0 auto}
.stamp svg *{vector-effect:non-scaling-stroke}
.nm{font-size:15px;font-weight:700;margin-top:8px}
.en2{font-family:var(--f-type);font-size:9.5px;color:var(--gray);letter-spacing:.06em;margin-top:2px;line-height:1.5}
.no{position:absolute;top:4px;left:8px;font-family:var(--f-type);font-size:9px;color:var(--gray)}
.val{position:absolute;top:4px;right:8px;font-family:var(--f-type);font-size:9px}
footer{max-width:1060px;margin:0 auto;font-family:var(--f-type);font-size:11px;color:var(--gray);letter-spacing:.1em}
</style>
</head>
<body>

<header>
  <h1><span class="en">LANDMARK STAMP SHEET · SHANGHAI · 18 PCS</span>上海地标 · 个性化插画图标</h1>
  <p class="sub">供地图组件使用的"个性化地标图标"素材：墨青单线线稿 + 一支家族油墨的雾感填色（18% 网点），一组一支墨。做成邮票贴纸页形态——图标从这页"撕下来"钉到地图上。</p>
</header>

<div id="sheets"></div>

<footer>RULE · 描边永远 --ink 单线（2px, round）；填色只用该组油墨的 18%/45% 两档；每组 = 一支墨，上地图后即是该区域的路线笔。</footer>

{name:'园林与古刹',en:'GARDENS & TEMPLES',ink:'pine',items:[

const root=document.getElementById('sheets');
GROUPS.forEach((g,gi)=>{
  const ink=`var(--${g.ink})`,f45=`var(--${g.ink}-45)`,f18=`var(--${g.ink}-18)`;
  const sheet=document.createElement('div');sheet.className='sheet';
  sheet.innerHTML=`<div class="sheet-head"><b>${g.name}<span style="font-family:var(--f-type);font-size:11px;font-weight:400;color:${ink};margin-left:12px;letter-spacing:.15em">${g.en} · INK ${g.ink.toUpperCase()}</span></b><span class="meta">SHEET 0${gi+1} · ${g.items.length} PCS · PERF 12</span></div>
  <div class="grid">${g.items.map((it,i)=>`
    <div class="stamp" style="background-color:${f18};background-image:radial-gradient(var(--old) 4.5px,transparent 5px)">
      <div class="stamp-inner">
        <span class="no">No.${gi+1}${String(i+1).padStart(2,'0')}</span>
        <span class="val" style="color:${ink}">¥ 1.20</span>
        <svg viewBox="0 0 64 64">${it.svg(f18,f45)}</svg>
        <div class="nm">${it.n}</div>
        <div class="en2">${it.e}</div>
        <div style="height:3px;margin-top:8px;background:${ink};width:36px;margin-left:auto;margin-right:auto"></div>
      </div>
    </div>`).join('')}</div>`;
  root.appendChild(sheet);
});
</script>
</body>
</html>
